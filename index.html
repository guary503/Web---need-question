<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #eef1f6; --muted: #9aa3b2; --line: rgba(255,255,255,.09); --accent: #ff2d55;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(22px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(22px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background:
      radial-gradient(1100px 560px at 50% -12%, rgba(255,45,85,.12), transparent 60%),
      radial-gradient(900px 520px at 50% 118%, rgba(70,100,180,.16), transparent 62%),
      linear-gradient(165deg, #141a24, #0a0c10);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 18px; }
  .card {
    border-radius: 18px; overflow: hidden; background: #000;
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px -24px rgba(0,0,0,.85);
  }
  .marco { width: 100%; aspect-ratio: 16 / 9; }
  .marco > div, .marco iframe { width: 100%; height: 100%; display: block; border: 0; }
  /* Video vertical (Shorts / grabado con el celular): la tarjeta se angosta */
  .wrap.vertical .card { width: min(100%, calc(78dvh * 9 / 16)); margin-inline: auto; }
  .wrap.vertical .marco { aspect-ratio: 9 / 16; }
  .meta { text-align: center; padding: 0 6px; }
  #titulo {
    margin: 0; font-weight: 650; line-height: 1.25; letter-spacing: .01em;
    font-size: clamp(1.05rem, 2.4vw, 1.5rem);
  }
  .canal {
    margin: .45rem 0 0; color: var(--muted); font-size: .9rem;
    display: flex; gap: .5rem; align-items: center; justify-content: center;
  }
  .canal:empty { display: none; }
  .canal::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
  }
  @media (max-width: 480px) {
    .card { border-radius: 14px; }
    .wrap { gap: 14px; }
  }
  /* Celular acostado: aprovechar el ancho, ocultar textos */
  @media (orientation: landscape) and (max-height: 520px) {
    body { padding: 10px; }
    .wrap { max-width: calc(128dvh * 16 / 9); gap: 0; }
    .meta { display: none; }
  }
  /* Aviso previo con botón Continuar */
  .aviso {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: max(22px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom));
    background: rgba(8,10,14,.72);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .aviso.oculto { display: none; }
  .aviso-card {
    width: min(440px, 100%); text-align: center;
    background: linear-gradient(165deg, #171d28, #0e121a);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 30px 26px; box-shadow: 0 30px 80px -24px rgba(0,0,0,.85);
  }
  .aviso-icono { font-size: 2.4rem; line-height: 1; }
  .aviso-card h2 { margin: 12px 0 8px; font-size: 1.25rem; font-weight: 650; }
  .aviso-card p { margin: 0 0 22px; color: var(--muted); line-height: 1.5; }
  #btnContinuar {
    appearance: none; -webkit-appearance: none; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 650;
    padding: 13px 30px; border-radius: 12px; width: 100%;
    box-shadow: 0 10px 30px -8px var(--accent);
    transition: transform .06s ease, filter .15s ease;
  }
  #btnContinuar:hover { filter: brightness(1.08); }
  #btnContinuar:active { transform: translateY(1px); }
  /* Modo grande al reproducir (pensado para móvil / iPad) */
  .card.grande { position: fixed; inset: 0; z-index: 30; width: 100%; border: 0; border-radius: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  .card.grande .marco { width: 100vw; height: 100dvh; aspect-ratio: auto; }
  .btn-cerrar-grande {
    position: fixed; z-index: 31; display: none;
    top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.55); color: #fff; font-size: 20px; line-height: 1;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  body.grande-activa .btn-cerrar-grande { display: block; }

  /* ---------- Cupones ---------- */
  .cupones { margin-top: 10px; }
  .cupones summary {
    list-style: none; cursor: pointer; user-select: none; -webkit-user-select: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; border-radius: 14px;
    background: linear-gradient(160deg, #1b2230, #121722);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    font-weight: 650; font-size: clamp(1rem, 2.2vw, 1.15rem);
    -webkit-tap-highlight-color: transparent;
  }
  .cupones summary::-webkit-details-marker { display: none; }
  .cupones summary:hover { box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .cupones .flecha {
    width: 10px; height: 10px; flex: none; margin-right: 4px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg) translateY(-3px); transition: transform .2s ease;
  }
  .cupones[open] .flecha { transform: rotate(-135deg) translate(-3px, 0); }
  .cupones-grid {
    display: grid; gap: 14px; margin-top: 16px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .cupon {
    position: relative; display: flex; flex-direction: column; gap: 4px;
    padding: 16px 18px 14px; border-radius: 16px;
    background: linear-gradient(160deg, #222b3b, #141a25);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
    /* muescas de ticket a los lados */
    -webkit-mask: radial-gradient(circle 11px at left center, #0000 98%, #000) left / 51% 100% no-repeat,
                  radial-gradient(circle 11px at right center, #0000 98%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 11px at left center, #0000 98%, #000) left / 51% 100% no-repeat,
                  radial-gradient(circle 11px at right center, #0000 98%, #000) right / 51% 100% no-repeat;
  }
  .cupon-emoji { font-size: 1.9rem; line-height: 1; }
  .cupon h3 { margin: 8px 0 0; font-size: 1rem; font-weight: 650; line-height: 1.3; flex: 1; }
  .cupon p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.45; flex: 1; }
  .cupon .linea { border-top: 1.5px dashed rgba(255,255,255,.14); margin: 12px -4px 0; }
  .canjear {
    appearance: none; -webkit-appearance: none; cursor: pointer; font: inherit; font-weight: 650;
    margin-top: 12px; padding: 10px; width: 100%; border-radius: 10px;
    background: rgba(255,45,85,.13); color: #ff7b93; border: 1px solid rgba(255,45,85,.45);
    transition: background .15s ease, transform .06s ease;
  }
  .canjear:hover { background: rgba(255,45,85,.22); }
  .canjear:active { transform: translateY(1px); }
  .sello {
    display: none; position: absolute; top: 14px; right: 12px; transform: rotate(10deg);
    border: 2px solid #34d399; color: #34d399; border-radius: 6px;
    padding: 3px 8px; font-size: .68rem; font-weight: 800; letter-spacing: .14em;
  }
  .cupon.canjeado .sello { display: block; }
  .cupon.canjeado .canjear { cursor: default; background: transparent; color: var(--muted); border-color: var(--line); }
  .cupon.suave { background: linear-gradient(160deg, #1c222d, #12161e); }
  .cupon.suave .canjear { background: transparent; color: var(--muted); border-color: rgba(255,255,255,.18); }

  /* Ventana para confirmar el canje */
  .modal-cupon .aviso-card { text-align: left; }
  .modal-cupon .aviso-icono, .modal-cupon h2 { text-align: center; }
  .modal-cupon p { text-align: center; margin-bottom: 16px; }
  .modal-cupon textarea {
    width: 100%; min-height: 92px; resize: vertical; font: inherit; color: var(--fg);
    background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; outline: none;
  }
  .modal-cupon textarea:focus { border-color: rgba(255,45,85,.6); }
  .modal-botones { display: flex; gap: 10px; margin-top: 14px; }
  .modal-botones button {
    flex: 1; appearance: none; -webkit-appearance: none; cursor: pointer; font: inherit; font-weight: 650;
    padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--fg);
  }
  .modal-botones .principal { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-cupon.listo textarea, .modal-cupon.listo #btnMejorNo { display: none; }
</style>
</head>
<body>
  <div id="aviso" class="aviso">
    <div class="aviso-card">
      <div class="aviso-icono">⏳</div>
      <h2>Antes de continuar</h2>
      <p>El siguiente video es <strong>largo, muy largo</strong>. Tómate un tiempo prudencial para verlo con calma.</p>
      <button id="btnContinuar">Continuar</button>
    </div>
  </div>
  <main class="wrap">
    <div class="card"><div class="marco"><div id="reproductor"></div></div></div>
    <div class="meta">
      <h1 id="titulo">Video</h1>
      <p id="canal" class="canal"></p>
    </div>
    <details class="cupones">
      <summary><span>🎟️ Cupones</span><span class="flecha" aria-hidden="true"></span></summary>
      <div id="cuponesGrid" class="cupones-grid"></div>
    </details>
  </main>

  <div id="modalCupon" class="aviso modal-cupon oculto" role="dialog" aria-modal="true">
    <div class="aviso-card">
      <div id="mcEmoji" class="aviso-icono">🎟️</div>
      <h2 id="mcTitulo">¿Canjear este cupón?</h2>
      <p id="mcTexto"></p>
      <textarea id="mcNota" maxlength="1000" placeholder="¿Querés decirme algo? (opcional)"></textarea>
      <div class="modal-botones">
        <button id="btnMejorNo">Mejor no</button>
        <button id="btnCanjear" class="principal">Sí, canjear</button>
      </div>
    </div>
  </div>
  <button id="cerrarGrande" class="btn-cerrar-grande" aria-label="Cerrar pantalla grande">✕</button>

<script>
/* ====== CONFIGURA AQUÍ ====== */
const VIDEO_ID   = "c8pquwQGouE";          // lo que va después de ?v= o youtu.be/
const TITULO     = "Video";
const ORIENTACION = "auto";                     // "auto", "vertical" u "horizontal"
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0jO-YBg9NeW6dTqhvZcHCvgM5KCDb9uGRqDon3U6u8eGKcKWDeCSVpJ7EE0hRppPc/exec";
/* ============================ */

document.title = TITULO;
const wrap = document.querySelector(".wrap");
const elTitulo = document.getElementById("titulo");
const elCanal = document.getElementById("canal");
elTitulo.textContent = TITULO;
if (ORIENTACION === "vertical") wrap.classList.add("vertical");

// Trae de YouTube el título, el canal y la forma (vertical/horizontal) del video
fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + VIDEO_ID))
  .then(r => r.json())
  .then(j => {
    if (TITULO === "Video" && j.title) { elTitulo.textContent = j.title; document.title = j.title; }
    if (j.author_name) elCanal.textContent = j.author_name;
    if (ORIENTACION === "auto" && j.height > j.width) wrap.classList.add("vertical");
  })
  .catch(() => {});

const id = crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });

let continuado = false, inicio = 0;
let visibleDesde = null;
let msVisible = 0;
let segundosVideo = 0, reproduciendoDesde = null, clicEnviado = false, cerrado = false;
let player = null, duracionVideo = 0, avanceMax = 0;
let apiLista = false, pendienteCrear = false;

function tiempos() {
  const ahora = performance.now();
  const vis = msVisible + (visibleDesde !== null ? ahora - visibleDesde : 0);
  const vid = segundosVideo + (reproduciendoDesde !== null ? (ahora - reproduciendoDesde) / 1000 : 0);
  return { tiempoTotal: Math.round((ahora - inicio) / 1000),
           tiempoVisible: Math.round(vis / 1000),
           segundosVideo: Math.round(vid) };
}

function estadoVideo() {
  if (player && player.getCurrentTime) {
    try {
      const pos = player.getCurrentTime() || 0;
      const dur = player.getDuration() || 0;
      if (pos > avanceMax) avanceMax = pos;
      if (dur) duracionVideo = dur;
    } catch (e) {}
  }
  const pct = duracionVideo ? Math.min(100, Math.round(avanceMax / duracionVideo * 100)) : 0;
  return { duracionVideo: Math.round(duracionVideo), avanceMax: Math.round(avanceMax), porcentaje: pct };
}

function enviar(tipo, extra = {}) {
  if (!continuado) return;   // nada se registra hasta que dan "Continuar"
  const datos = JSON.stringify({ id, tipo, ...tiempos(), ...estadoVideo(), ...extra });
  // text/plain evita el bloqueo CORS de Google Apps Script.
  // Primero fetch normal (los bloqueadores de anuncios suelen bloquear sendBeacon
  // sin avisar); si fetch falla, se intenta con sendBeacon como respaldo.
  fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", keepalive: true,
    headers: { "Content-Type": "text/plain;charset=utf-8" }, body: datos })
    .catch(() => {
      try { navigator.sendBeacon(SCRIPT_URL, new Blob([datos], { type: "text/plain;charset=utf-8" })); } catch (e) {}
    });
}

/* ---------- Especificaciones del dispositivo ---------- */
async function datosDispositivo() {
  const ua = navigator.userAgent;
  const d = {
    userAgent: ua,
    pantalla: `${screen.width}x${screen.height}`,
    ventana: `${innerWidth}x${innerHeight}`,
    densidad: devicePixelRatio,
    nucleos: navigator.hardwareConcurrency,
    memoriaGB: navigator.deviceMemory,
    tactil: navigator.maxTouchPoints > 0 ? "sí" : "no",
    idioma: navigator.language,
    zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone,
    conexion: navigator.connection ? `${navigator.connection.effectiveType || ""} ${navigator.connection.downlink ? navigator.connection.downlink + " Mbps" : ""}`.trim() : "",
    referencia: document.referrer || "(directo)",
  };
  d.sistema = /Windows/.test(ua) ? "Windows" : /Android/.test(ua) ? "Android"
    : /iPhone|iPad|iPod/.test(ua) ? "iOS" : /Mac OS X/.test(ua) ? "macOS"
    : /CrOS/.test(ua) ? "ChromeOS" : /Linux/.test(ua) ? "Linux" : "Otro";
  d.navegador = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera"
    : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /Firefox\//.test(ua) ? "Firefox"
    : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "Otro";
  const m = ua.match(/(?:Edg|OPR|SamsungBrowser|Firefox|Chrome|Version)\/([\d.]+)/);
  if (m) d.navegador += " " + m[1].split(".")[0];
  const and = ua.match(/Android ([\d.]+);\s*([^;)]+)/);
  if (and) { d.versionSistema = and[1]; if (and[2].trim() !== "K") d.modelo = and[2].trim(); }
  const ios = ua.match(/OS (\d+[_\d]*) like Mac/);
  if (ios) { d.versionSistema = ios[1].replace(/_/g, "."); d.modelo = /iPad/.test(ua) ? "iPad" : "iPhone"; }
  d.tipo = /iPad|Tablet/.test(ua) || (/Android/.test(ua) && !/Mobile/.test(ua)) ? "Tablet"
    : /Mobi|iPhone|Android/.test(ua) ? "Celular" : "Computadora";

  // Detección de bots (robots de internet que ejecutan la página)
  const razonesBot = [];
  if (navigator.webdriver) razonesBot.push("navegador automatizado");
  if (/bot|spider|crawl|headless|slurp|python-requests|curl|wget|facebookexternalhit|whatsapp|slackbot|telegrambot|bytespider|ia_archiver|bingpreview|embedly|preview|lighthouse|monitor/i.test(ua))
    razonesBot.push("user-agent de robot");
  const esMovil = /Mobi|iPhone|Android/i.test(ua);
  if (esMovil && navigator.maxTouchPoints === 0) razonesBot.push("dice ser móvil pero sin pantalla táctil");
  if (esMovil && Math.min(screen.width, screen.height) >= 1000) razonesBot.push("dice ser móvil pero con pantalla de escritorio");
  if (!navigator.languages || navigator.languages.length === 0) razonesBot.push("sin idiomas configurados");
  d.bot = razonesBot.length ? "SÍ" : "no";
  d.botMotivo = razonesBot.join("; ");

  const tareas = [];
  if (navigator.userAgentData?.getHighEntropyValues) {
    tareas.push(navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"])
      .then(h => {
        if (h.model) d.modelo = h.model;
        if (h.platformVersion) d.versionSistema = d.sistema === "Windows"
          ? (parseInt(h.platformVersion) >= 13 ? "11" : "10") : h.platformVersion;
      }).catch(() => {}));
  }
  // IP pública (Google Apps Script no la recibe por sí solo)
  tareas.push(fetch("https://api.ipify.org?format=json").then(r => r.json())
    .then(j => { d.ip = j.ip; }).catch(() => {}));
  await Promise.race([Promise.all(tareas), new Promise(r => setTimeout(r, 3000))]);
  return d;
}

// Los datos del dispositivo se preparan al cargar; el registro y la notificación
// se envían solo cuando la persona da "Continuar".
const promesaDatos = datosDispositivo();

async function continuar() {
  if (continuado) return;
  continuado = true;
  inicio = performance.now();
  visibleDesde = document.visibilityState === "visible" ? inicio : null;
  document.getElementById("aviso").classList.add("oculto");
  const dispositivo = await promesaDatos;
  enviar("entrada", { dispositivo });
  setInterval(() => { if (!cerrado) enviar("latido"); }, 8000);
  if (apiLista) crearPlayer(); else pendienteCrear = true;
}
document.getElementById("btnContinuar").addEventListener("click", continuar);

/* ---------- Tiempo visible / cierre ---------- */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    if (visibleDesde !== null) { msVisible += performance.now() - visibleDesde; visibleDesde = null; }
    enviar("oculta");
  } else {
    visibleDesde = performance.now();
    if (!cerrado) enviar("visible");
  }
});
function cerrar() { if (cerrado) return; cerrado = true; enviar("cierre"); }
addEventListener("pagehide", cerrar);
addEventListener("beforeunload", cerrar);
addEventListener("pageshow", e => { if (e.persisted) { cerrado = false; enviar("visible"); } });

/* ---------- Pantalla grande al reproducir ---------- */
const tarjeta = document.querySelector(".card");
const btnCerrarGrande = document.getElementById("cerrarGrande");
function agrandar() {
  if (tarjeta.classList.contains("grande")) return;
  tarjeta.classList.add("grande");
  document.body.classList.add("grande-activa");
  const pedir = tarjeta.requestFullscreen || tarjeta.webkitRequestFullscreen;
  if (pedir) { try { const pr = pedir.call(tarjeta); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {} }
}
function achicar() {
  tarjeta.classList.remove("grande");
  document.body.classList.remove("grande-activa");
  const salir = document.exitFullscreen || document.webkitExitFullscreen;
  if ((document.fullscreenElement || document.webkitFullscreenElement) && salir) { try { salir.call(document); } catch (e) {} }
}
btnCerrarGrande.addEventListener("click", achicar);
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    tarjeta.classList.remove("grande"); document.body.classList.remove("grande-activa");
  }
});

/* ---------- Cupones ---------- */
// Edita aquí los cupones (emoji y título) y el mensaje que ve al canjear.
const GRACIAS = "¡Listo! Ya me llegó el aviso. Vos decís cuándo 😊";
const CUPONES = [
  { emoji: "☕", titulo: "Vale por un café" },
  { emoji: "🚶", titulo: "Vale por una caminata" },
  { emoji: "🍦", titulo: "Vale por un helado" },
  { emoji: "🍽️", titulo: "Vale por una cena" },
  { emoji: "🎬", titulo: "Vale por una salida al cine" },
  { emoji: "🏖️", titulo: "Vale por un día de playa" },
  { emoji: "🎷", titulo: "Vale por una canción en saxo" },
  { emoji: "💬", titulo: "Vale por una plática donde solo escucho" },
  { emoji: "❄️", titulo: "Vale por aire acondicionado" },
  { emoji: "🪂", titulo: "Vale por una experiencia extrema" },
];

const CLAVE_CANJE = "cupones-canjeados";
function leerCanjes() { try { return JSON.parse(localStorage.getItem(CLAVE_CANJE)) || []; } catch (e) { return []; } }
function guardarCanje(t) {
  try { const l = leerCanjes(); if (!l.includes(t)) l.push(t); localStorage.setItem(CLAVE_CANJE, JSON.stringify(l)); } catch (e) {}
}

const grid = document.getElementById("cuponesGrid");
const modal = document.getElementById("modalCupon");
const mcEmoji = document.getElementById("mcEmoji"), mcTitulo = document.getElementById("mcTitulo");
const mcTexto = document.getElementById("mcTexto"), mcNota = document.getElementById("mcNota");
const btnCanjear = document.getElementById("btnCanjear"), btnMejorNo = document.getElementById("btnMejorNo");
let cuponActivo = null, tarjetaActiva = null;

function desmarcar(el) {
  el.classList.remove("canjeado");
  const b = el.querySelector(".canjear"); b.textContent = "Canjear"; b.disabled = false;
}
function restablecerCupones() {
  try { localStorage.removeItem(CLAVE_CANJE); } catch (e) {}
  document.querySelectorAll(".cupon").forEach(desmarcar);
}

function marcarCanjeado(el) {
  el.classList.add("canjeado");
  const b = el.querySelector(".canjear"); b.textContent = "Canjeado ✓"; b.disabled = true;
}

const yaCanjeados = leerCanjes();
CUPONES.forEach(c => {
  const el = document.createElement("article");
  el.className = "cupon" + (c.suave ? " suave" : "");
  const em = document.createElement("div"); em.className = "cupon-emoji"; em.textContent = c.emoji;
  const h = document.createElement("h3"); h.textContent = c.titulo;
  const ln = document.createElement("div"); ln.className = "linea";
  const b = document.createElement("button"); b.className = "canjear"; b.textContent = "Canjear";
  const s = document.createElement("span"); s.className = "sello"; s.textContent = "CANJEADO";
  el.append(s, em, h, ln, b);
  b.addEventListener("click", () => abrirCupon(c, el));
  if (yaCanjeados.includes(c.titulo)) marcarCanjeado(el);
  grid.appendChild(el);
});

// Restablecer solo en este dispositivo: abrir la web con ?reset al final
if (new URLSearchParams(location.search).has("reset")) {
  restablecerCupones();
  history.replaceState(null, "", location.pathname);
}
// Restablecer para todos: cambiar el número de la pestaña "Config" de la hoja
const CLAVE_REINICIO = "cupones-reinicio";
fetch(SCRIPT_URL + "?accion=estado")
  .then(r => r.json())
  .then(j => {
    const actual = String(j.reinicio || "");
    if (!actual) return;
    let previo = null;
    try { previo = localStorage.getItem(CLAVE_REINICIO); } catch (e) {}
    if (previo !== null && previo !== actual) restablecerCupones();
    try { localStorage.setItem(CLAVE_REINICIO, actual); } catch (e) {}
  })
  .catch(() => {});

function abrirCupon(c, el) {
  if (el.classList.contains("canjeado")) return;
  cuponActivo = c; tarjetaActiva = el;
  modal.classList.remove("listo");
  mcEmoji.textContent = c.emoji;
  mcTitulo.textContent = "¿Canjear este cupón?";
  mcTexto.textContent = c.titulo;
  mcNota.value = "";
  btnCanjear.textContent = "Sí, canjear";
  modal.classList.remove("oculto");
}
function cerrarModal() { modal.classList.add("oculto"); cuponActivo = null; tarjetaActiva = null; }
btnMejorNo.addEventListener("click", cerrarModal);
modal.addEventListener("click", e => { if (e.target === modal) cerrarModal(); });
btnCanjear.addEventListener("click", () => {
  if (modal.classList.contains("listo")) { cerrarModal(); return; }
  if (!cuponActivo) return;
  enviar("cupon", { cupon: cuponActivo.titulo, nota: mcNota.value.trim().slice(0, 1000) });
  guardarCanje(cuponActivo.titulo);
  marcarCanjeado(tarjetaActiva);
  modal.classList.add("listo");
  mcTitulo.textContent = "¡Cupón canjeado!";
  mcTexto.textContent = cuponActivo.gracias || GRACIAS;
  btnCanjear.textContent = "Cerrar";
});

/* ---------- Reproductor de YouTube ---------- */
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  apiLista = true;
  if (pendienteCrear) crearPlayer();
}
function crearPlayer() {
  player = new YT.Player("reproductor", {
    videoId: VIDEO_ID,
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
    events: { onStateChange: e => {
      if (e.data === YT.PlayerState.PLAYING) {
        if (reproduciendoDesde === null) reproduciendoDesde = performance.now();
        if (!clicEnviado) { clicEnviado = true; enviar("clic_video"); }
        agrandar();
      } else if (reproduciendoDesde !== null) {
        segundosVideo += (performance.now() - reproduciendoDesde) / 1000;
        reproduciendoDesde = null;
        if (e.data === YT.PlayerState.ENDED) { enviar("video_terminado"); achicar(); }
      }
    }}
  });
}
